function bee(x,y,t){

function drawMC(ox,t){

  R(c,ox-135,HOR-6,270,6,'#8A4A3A');for(let x=ox-135;x<ox+135;x+=6)R(c,x,HOR-6,1,6,'#6B3A2C');R(c,ox-135,HOR-7,270,1,'#B8B0A0');

function flag(x,y,indo){
  if(indo===3){R(c,x,y,16,10,'#6CABDD');ELL(c,x+8,y+5,3,2,'#FFD400');R(c,x+7,y+4,1,3,'#000');R(c,x+9,y+4,1,3,'#000');R(c,x+6,y+2,3,1,'#FFFFFF');R(c,x+9,y+2,3,1,'#FFFFFF');return;}

  if(indo){R(c,x,y,16,5,'#E70011');R(c,x,y+5,16,5,P.white);return;}
  R(c,x,y,16,10,'#1030A0');

const sprCv=document.createElement('canvas');sprCv.width=90;sprCv.height=80;const sc=sprCv.getContext('2d');
function drawHalima(ctx,ox,oy,o){

      for(let i=0;i<17;i++)ctx.fillRect(Math.round(px+dx*i)-off,Math.round(py+dy*i)-off,sz,sz);}

function ditherCover(w){

requestAnimationFrame(frame);
})();
