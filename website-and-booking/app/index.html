<meta name="theme-color" content="#16140F" media="(prefers-color-scheme: dark)">

<meta name="mobile-web-app-capable" content="yes">

<link rel="preload" href="/fonts/TAN-ASHFORD.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/calm.css">
<style>
  /* haloe practitioner app. Tokens come from /calm.css; this file adds the
     app shell (header, floating nav), the dark theme, and the screens. */
  :root {
    --font: 'Poppins', -apple-system, 'Segoe UI', Arial, sans-serif;
    --font-wordmark: 'Tan Ashford', Georgia, serif;
    --red: #B3402F; --red-bg: #FBEAE6; --red-line: #E9B9AF;
    --green: #2F6B3F; --green-bg: #E7F1E8; --green-line: #B5D3B9;
    --nav-h: 84px;
    --tagline: #7A5F25;
    --arr-muted: #6B5E4B;
  }
  :root[data-theme="dark"] {
    --page-bg: #16140F; --card: #211E17; --fill: #2C281F; --fill-hover: #353026;
    --ink: #F3EEE3; --muted: #A89F8B; --gold-deep: #D7BC82;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    --red: #F0907F; --red-bg: #3A1F1A; --red-line: #6B3329;
    --green: #8CCB98; --green-bg: #1B2E20; --green-line: #34573B;
    --tagline: #D7BC82;
    --arr-muted: var(--muted);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page-bg: #16140F; --card: #211E17; --fill: #2C281F; --fill-hover: #353026;
      --ink: #F3EEE3; --muted: #A89F8B; --gold-deep: #D7BC82;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
      --red: #F0907F; --red-bg: #3A1F1A; --red-line: #6B3329;
      --green: #8CCB98; --green-bg: #1B2E20; --green-line: #34573B;
      --tagline: #D7BC82;
      --arr-muted: var(--muted);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { font-size: 78%; color-scheme: light dark; }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"] { color-scheme: dark; }
  body { margin: 0; font-family: var(--font); background: var(--page-bg); color: var(--ink); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  [hidden] { display: none !important; }

  /* sign-in: "Arrival" — centred mark + big wordmark, one calm column, no card */
  .login-top { display: flex; justify-content: flex-end; padding: calc(10px + env(safe-area-inset-top)) 16px 0; }
  .arrival, .arrival button, .arrival input { font-family: var(--font); }
  .arrival { min-height: calc(100vh - 66px - env(safe-area-inset-top)); min-height: calc(100svh - 66px - env(safe-area-inset-top)); max-width: 480px; margin: 0 auto; padding: 0 24px calc(18px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; align-items: center; }
  .arr-brand { text-align: center; margin-top: 4px; width: 100%; }
  .arr-mark { width: 64px; height: 64px; display: block; margin: 0 auto; }
  .arr-word { font-family: var(--font-wordmark); font-size: 72px; line-height: 1; color: #111; margin-top: 30px; letter-spacing: 0.005em; }
  :root[data-theme="dark"] .arr-word { color: var(--ink); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .arr-word { color: var(--ink); } }
  .arr-tag { font-size: 11px; font-weight: 500; letter-spacing: 0.28em; text-transform: uppercase; color: var(--tagline); margin: 12px 0 0; padding-left: 0.28em; white-space: nowrap; }
  .arr-lower { width: 100%; margin-top: auto; padding-top: 32px; }
  .arr-h { font-family: var(--font); font-weight: 500; font-size: 30px; line-height: 1.2; letter-spacing: -0.01em; color: var(--ink); margin: 0 0 10px; outline: none; }
  .arr-sub { font-family: var(--font); font-weight: 400; font-size: 16px; line-height: 1.55; color: var(--arr-muted); margin: 0 0 26px; }
  .arr-sub b { color: var(--ink); font-weight: 400; overflow-wrap: anywhere; }
  .arr-label { display: block; font-size: 13px; font-weight: 500; letter-spacing: 0.06em; color: var(--muted); }
  .arr-input { display: block; width: 100%; height: 52px; padding: 0; border: 0; border-bottom: 2px solid color-mix(in srgb, var(--ink) 40%, transparent); border-radius: 0; background: transparent; color: var(--ink); font: inherit; font-size: 18px; outline: none; -webkit-appearance: none; appearance: none; }
  .arr-input::placeholder { color: color-mix(in srgb, var(--muted) 75%, transparent); }
  .arr-input:focus { border-bottom-color: var(--gold); box-shadow: 0 2px 0 var(--gold); }
  .arr-input:-webkit-autofill, .arr-input:-webkit-autofill:focus { -webkit-box-shadow: 0 0 0 100px var(--page-bg) inset; -webkit-text-fill-color: var(--ink); transition: background-color 100000s; }
  .arr-btn { display: flex; align-items: center; justify-content: center; width: 100%; height: 56px; margin-top: 24px; border: 0; border-radius: 999px; background: var(--gold); color: #1C1A16; font: inherit; font-size: 17px; font-weight: 600; }
  .arr-btn[disabled] { cursor: default; }
  .arr-btn.ghost { background: var(--fill); color: var(--ink); margin-top: 16px; }
  .arr-btn.ghost[disabled] { color: var(--muted); }
  .arr-textbtn { display: block; margin: 6px auto 0; min-height: 48px; padding: 0 16px; border: 0; background: none; color: var(--gold-deep); font: inherit; font-size: 15px; font-weight: 500; text-decoration: underline; text-underline-offset: 3px; }
  .arr-card { background: var(--card); border-radius: 24px; padding: 20px; box-shadow: var(--shadow); }
  .arr-card p { margin: 0; }
  .arr-card .t { font-size: 16px; font-weight: 600; line-height: 1.4; }
  .arr-card .s { font-size: 14.5px; color: var(--muted); line-height: 1.5; margin-top: 6px; }
  .arr-err { margin: 12px 0 0; font-size: 14px; line-height: 1.45; color: var(--arr-muted); text-align: center; }
  .arr-err:empty { display: none; }
  .arr-foot { width: 100%; margin-top: 22px; text-align: center; font-size: 14px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .arr-foot a { display: inline-flex; align-items: center; min-height: 44px; padding: 0 4px; color: var(--gold-deep); font-weight: 500; text-decoration: underline; text-underline-offset: 3px; background: none; border: 0; font: inherit; font-size: 14px; font-weight: 500; }
  .arr-foot span { line-height: 1.5; }

  /* header */
  .app-head { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; padding: calc(10px + env(safe-area-inset-top)) 16px 10px; background: color-mix(in srgb, var(--page-bg) 88%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); }
  .brand img { width: 30px; height: 30px; display: block; }
  .brand span { font-family: var(--font-wordmark); font-size: 28px; line-height: 1; color: #111; letter-spacing: 0.01em; }
  :root[data-theme="dark"] .brand span { color: var(--ink); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .brand span { color: var(--ink); } }
  .icon-btn { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--fill); display: grid; place-items: center; color: var(--ink); }
  .icon-btn svg { width: 20px; height: 20px; }
  .head-actions { display: flex; gap: 8px; }

  .wrap { max-width: 600px; margin: 0 auto; padding: 8px 16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom)); }
  .eyebrow { font-size: 14px; font-weight: 500; color: var(--gold-deep); margin: 10px 4px 2px; }
  h1.screen { font-family: var(--font); font-weight: 700; font-size: 36px; line-height: 1.12; letter-spacing: -0.02em; margin: 0 4px 18px; color: var(--ink); }
  h2.sub { font-size: 12px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin: 24px 4px 12px; }
  .lab { font-size: 12px; font-weight: 500; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .card .section-label { color: var(--muted); }
  .muted { color: var(--muted); }
  .small { font-size: 13px; }

  /* floating pill nav */
  .tabbar { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom)); z-index: 30; width: min(calc(100% - 32px), 440px); display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 6px; background: color-mix(in srgb, var(--card) 92%, transparent); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-radius: 999px; box-shadow: 0 8px 30px rgba(40,30,10,.16), 0 1px 2px rgba(40,30,10,.08); }
  .tabbar.three { grid-template-columns: repeat(3, 1fr); }
  a.listrow { text-decoration: none; color: inherit; }
  a.btn.block { display: flex; }
  .nx-date { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; margin-top: 10px; }
  .nx-time { font-size: 20px; color: var(--gold-deep); font-weight: 500; margin-top: 2px; }
  .tabbar button { min-height: 52px; border: 0; background: transparent; border-radius: 999px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11.5px; font-weight: 500; color: var(--muted); }
  .tabbar button svg { width: 22px; height: 22px; }
  .tabbar button[aria-current="page"] { color: var(--gold-deep); font-weight: 600; }
  :root[data-theme="dark"] .tabbar button[aria-current="page"] { color: var(--gold); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tabbar button[aria-current="page"] { color: var(--gold); } }

  /* cards + bits */
  .card { background: var(--card); border-radius: 24px; padding: 20px; margin: 0 0 16px; box-shadow: var(--shadow); }
  .card.tight { padding: 14px 16px; }
  .chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 14px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: 0 0 auto; min-height: 44px; padding: 0 18px; border-radius: 999px; border: 0; background: var(--fill); font-weight: 500; font-size: 14px; color: var(--ink); }
  .chip[aria-pressed="true"] { background: var(--gold); color: #1C1A16; }
  .pill { display: inline-flex; align-items: center; min-height: 24px; padding: 0 10px; border-radius: 999px; font-size: 11.5px; font-weight: 500; white-space: nowrap; }
  .pill.red { background: var(--red-bg); color: var(--red); border: 1px solid var(--red-line); }
  .pill.green { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-line); }
  .pill.gold { background: var(--fill); color: var(--gold-deep); }
  .pill.amber { background: #FBF0D7; color: #8A5A00; }
  :root[data-theme="dark"] .pill.amber { background: #3A2E10; color: #E8B85A; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pill.amber { background: #3A2E10; color: #E8B85A; } }
  .tag { display: inline-flex; align-items: center; min-height: 24px; padding: 0 11px; border-radius: 999px; background: var(--gold); color: #1C1A16; font-size: 11.5px; font-weight: 600; white-space: nowrap; }
  .gold-card { background: var(--gold); color: #1C1A16; }
  .gold-card .section-label { color: rgba(28,26,22,.65); }
  .gold-card .nx-time { color: #1C1A16; }
  .gold-card .btn { background: #1C1A16; color: #F5F0E8; }
  .gold-card .btn.ghost { background: rgba(28,26,22,.12); color: #1C1A16; }
  .gold-card .tag { background: rgba(28,26,22,.12); }
  .btn.sm { min-height: 40px; padding: 0 14px; font-size: 13.5px; }
  .h .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .day-label { font-size: 13px; font-weight: 500; color: var(--muted); margin: 18px 4px 8px; }
  .empty { text-align: center; color: var(--muted); padding: 28px 12px; }

  /* session rows (Today) */
  .sess { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; align-items: center; padding: 14px 16px; }
  .sess .who { display: flex; flex-direction: column; gap: 2px; min-width: 0; text-align: left; background: none; border: 0; padding: 0; min-height: 44px; justify-content: center; }
  .sess .name { font-weight: 600; font-size: 17px; overflow-wrap: anywhere; }
  .sess .time { color: var(--gold-deep); font-weight: 500; font-size: 14px; }
  .sess .meta { color: var(--muted); font-size: 13.5px; }
  .sess .row2 { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
  .tick { width: 44px; height: 44px; border-radius: 50%; border: 2px solid var(--fill-hover); background: transparent; display: grid; place-items: center; color: transparent; }
  .tick svg { width: 20px; height: 20px; }
  .tick[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: #fff; }
  .sess.done .name, .sess.done .meta, .sess.done .time { opacity: .5; }

  /* search + lists */
  .search { width: 100%; min-height: 48px; border-radius: 16px; border: 1px solid var(--fill-hover); background: var(--card); padding: 0 16px; margin-bottom: 14px; font-size: 16px; }
  .listrow { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; min-height: 64px; padding: 12px 16px; border: 0; text-align: left; background: var(--card); border-radius: 20px; box-shadow: var(--shadow); margin-bottom: 10px; }
  .listrow .nm { font-weight: 600; overflow-wrap: anywhere; }
  .listrow .sb { font-size: 13px; color: var(--muted); }

  /* brief */
  .back { min-height: 44px; display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; padding: 0 4px; color: var(--gold-deep); font-weight: 500; font-size: 15px; }
  .back svg { width: 18px; height: 18px; }
  .brief-name { font-family: var(--font); font-weight: 700; font-size: 28px; line-height: 1.2; letter-spacing: -0.02em; margin: 2px 0 6px; overflow-wrap: anywhere; }
  .facts { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; margin-top: 14px; }
  .fact .k { font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .fact .v { font-weight: 500; overflow-wrap: anywhere; }
  .fact.wide { grid-column: 1 / -1; }
  .contact { display: flex; gap: 8px; margin-top: 16px; }
  .btn { min-height: 44px; padding: 0 18px; border-radius: 999px; border: 0; background: var(--gold); color: #1C1A16; font-weight: 600; font-size: 15px; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
  .btn.ghost { background: var(--fill); color: var(--ink); }
  .btn.block { width: 100%; }
  /* A button whose label may wrap to two lines ("Worried about a mark? Send Halima a photo"): grows with its text, never a fixed height. One-line gold buttons keep the plain .btn height. */
  .btn.multi { height: auto; min-height: 44px; padding: 14px 20px; line-height: 1.3; border-radius: 28px; text-align: center; }
  .btn[disabled] { opacity: .45; cursor: not-allowed; }
  .sig { margin-top: 14px; display: flex; align-items: center; gap: 12px; }
  .sig .thumb { width: 120px; height: 54px; border-radius: 10px; background: #fff; border: 1px solid var(--fill-hover); object-fit: contain; }
  .act { background: var(--red-bg); }
  .act .section-label { color: var(--red); }
  .act ul { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 12px; }
  .act li { padding-left: 14px; position: relative; }
  .act li::before { content: ''; position: absolute; left: 0; top: .6em; width: 6px; height: 6px; border-radius: 50%; background: var(--red); }
  .act li b { display: block; color: var(--ink); font-weight: 600; }
  .act li span { color: var(--ink); opacity: .85; }
  .clear { background: var(--green-bg); color: var(--green); font-weight: 600; }
  .inwords { font-family: var(--serif-text); font-size: 17px; line-height: 1.5; margin: 6px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .inwords.none { color: var(--muted); font-style: italic; }
  .kv { display: grid; gap: 14px; }
  .kv .k { font-size: 11.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .hist { display: grid; gap: 10px; margin-top: 10px; }
  .hist .h { padding: 12px 14px; background: var(--fill); border-radius: 16px; font-size: 14px; }
  .hist .h b { font-weight: 600; }
  textarea.note { width: 100%; min-height: 110px; border-radius: 16px; border: 1px solid var(--fill-hover); background: var(--card); padding: 12px 14px; font-size: 16px; resize: vertical; }
  .note-item { padding: 12px 14px; background: var(--fill); border-radius: 16px; margin-top: 10px; }
  .note-item .when { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .note-item p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; }

  /* codes */
  .codecard .top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .codecard .code { font-weight: 600; font-size: 18px; letter-spacing: .02em; overflow-wrap: anywhere; }
  .codecard .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .codecard .stats .k { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .codecard .stats .v { font-weight: 600; }
  .switch { position: relative; width: 56px; height: 32px; border-radius: 999px; border: 0; background: var(--fill-hover); flex: 0 0 auto; }
  .switch::after { content: ''; position: absolute; top: 3px; left: 3px; width: 26px; height: 26px; border-radius: 50%; background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .15s; }
  .switch[aria-checked="true"] { background: var(--gold); }
  .switch[aria-checked="true"]::after { transform: translateX(24px); }
  .switch-wrap { min-width: 44px; min-height: 44px; display: grid; place-items: center; background: none; border: 0; padding: 0; }
  .toggle-line { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; margin: 4px 4px 14px; font-size: 14px; }
  label.f { display: block; font-size: 12px; font-weight: 500; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 14px 0 6px; }
  .in { width: 100%; min-height: 48px; border-radius: 14px; border: 1px solid var(--fill-hover); background: var(--card); padding: 0 14px; font-size: 16px; }
  .warn { background: var(--red-bg); border: 1px solid var(--red-line); color: var(--ink); border-radius: 16px; padding: 12px 14px; font-size: 14px; margin-top: 14px; }
  .warn b { color: var(--red); }

  /* stats */
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
  .tiles.two { grid-template-columns: repeat(2, 1fr); }
  .tile { background: var(--card); border-radius: 24px; padding: 16px 14px; box-shadow: var(--shadow); min-width: 0; }
  .tile .k { font-size: 12px; color: var(--muted); }
  .tile .v { font-size: 26px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15; margin-top: 6px; overflow-wrap: anywhere; }
  .tile .s { font-size: 11.5px; color: var(--muted); margin-top: 4px; line-height: 1.35; }

  /* Today hero */
  .hero { display: flex; align-items: center; gap: 18px; }
  .ring { width: 92px; height: 92px; flex: 0 0 auto; position: relative; }
  .ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
  .ring .t { fill: none; stroke: var(--fill); stroke-width: 9; }
  .ring .p { fill: none; stroke: var(--gold); stroke-width: 9; stroke-linecap: round; transition: stroke-dasharray .4s; }
  .ring b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
  .hero h2 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; }
  .hero p { margin: 4px 0 0; color: var(--muted); font-size: 14px; line-height: 1.4; }

  /* settings */
  .seg { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; padding: 4px; background: var(--fill); border-radius: 16px; margin-top: 12px; }
  .seg button { min-height: 44px; border: 0; border-radius: 12px; background: transparent; font-weight: 500; font-size: 14px; }
  .seg button[aria-pressed="true"] { background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.12); font-weight: 600; }

  /* progress chart + check-in sheet */

const urlB64ToBytes = (b64) => { const t = (b64 + '='.repeat((4 - (b64.length % 4)) % 4)).replace(/-/g, '+').replace(/_/g, '/'); return Uint8Array.from(atob(t), (c) => c.charCodeAt(0)); };
const isStandalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
// Thin wrapper over the browser APIs so it can be replaced in tests.
const pushApi = {
  supported: () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window,
  isIOS: () => /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1),
  permission: () => Notification.permission,
  requestPermission: () => Notification.requestPermission(),
  async getSub() { const reg = await navigator.serviceWorker.ready; return reg.pushManager.getSubscription(); },
  async subscribe() { const reg = await navigator.serviceWorker.ready; return reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64ToBytes(VAPID_PUBLIC) }); },
  async unsubscribe(sub) { try { await sub.unsubscribe(); } catch (e) {} },
};
function subRow(sub) {
  const j = sub.toJSON();
  return { user_id: S.session.user.id, endpoint: j.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth, user_agent: navigator.userAgent.slice(0, 200), notify_reschedule: true, notify_booking: true, notify_intake: true, notify_photo: true };
}
/** Client Settings: how many photos she has, and a two-tap "Delete my photos". */
async function initClientPhotoCard() {

  let n = 0;
  try { n = (await api.myPhotoSubmissions()).reduce((t, x) => t + (x.paths || []).length, 0); } catch (e) { cnt.textContent = ''; }
  const label = () => { cnt.textContent = n ? 'You have ' + n + ' photo' + (n === 1 ? '' : 's') + ' saved.' : 'You have no photos saved.'; btn.disabled = !n; btn.textContent = 'Delete my photos'; };
  label();

    clearTimeout(armed); armed = null; btn.disabled = true; btn.textContent = 'Deleting…';
    try { await api.deleteMyPhotos(); n = 0; toastMsg('Your photos have been deleted'); } catch (e) { toastMsg(friendly(e, 'delete')); }
    label();

}
/** Client Settings: allow quiet aftercare reminders (day 1 and day 7) on this device. */
async function initClientPushCard() {
  const box = document.getElementById('cpushBody'); if (!box) return;
  const draw = (html) => { const b = document.getElementById('cpushBody'); if (b) b.innerHTML = html; };
  const intro = '<p class="muted small" style="margin:0 0 6px">A quiet reminder on day 1 and day 7 after a session. It never shows any detail.</p>';
  if (!pushApi.supported()) return draw(intro + (pushApi.isIOS() && !isStandalone() ? '<p class="muted small" style="margin:0">On iPhone, first add haloe to your Home Screen (Share → Add to Home Screen), then open it from there.</p>' : '<p class="muted small" style="margin:0">This browser can’t show reminders.</p>'));
  if (pushApi.permission() === 'denied') return draw(intro + '<p class="muted small" style="margin:0">Reminders are blocked for haloe on this device. Allow notifications in your browser or phone settings to turn them on.</p>');
  let sub = null, row = null;
  try { sub = pushApi.permission() === 'granted' ? await pushApi.getSub() : null; if (sub) row = await api.getPushRow(sub.toJSON().endpoint); } catch (e) { return draw(intro + '<p class="muted small" style="margin:0">Couldn’t load this setting just now.</p>'); }
  const on = !!(sub && row);
  draw(intro + '<div class="toggle-line" style="margin:2px 0"><span>Reminders on this device</span><button class="switch-wrap" id="cpushMain" aria-label="Reminders on this device"><span class="switch" role="switch" aria-checked="' + on + '"></span></button></div>');
  document.getElementById('cpushMain').onclick = async () => {
    try {
      if (on) { const ep = sub.toJSON().endpoint; await pushApi.unsubscribe(sub); await api.deletePushRow(ep); }

        const perm = await pushApi.requestPermission();
        if (perm !== 'granted') { toastMsg('Reminders weren’t allowed on this device'); return initClientPushCard(); }
        const ns = sub || await pushApi.subscribe(); if (!row) await api.savePushRow(subRow(ns));
      }

}

/** Fills the "Alerts on this device" card on Settings (admin only). */
async function initPushCard() {
  const box = document.getElementById('pushBody'); if (!box) return;
  const draw = (html) => { if (document.getElementById('pushBody')) document.getElementById('pushBody').innerHTML = html; };
  if (!pushApi.supported()) {
    return draw(pushApi.isIOS() && !isStandalone()
      ? '<p class="muted small" style="margin:8px 0 0">On iPhone, first add haloe to your Home Screen (Share → Add to Home Screen), then open it from there to turn alerts on.</p>'
      : '<p class="muted small" style="margin:8px 0 0">This browser can’t show alerts. Try Chrome on Android, or the Home Screen app on iPhone.</p>');
  }
  if (pushApi.permission() === 'denied') return draw('<p class="muted small" style="margin:8px 0 0">Alerts are blocked for haloe on this device. Allow notifications in your browser or phone settings, then come back here.</p>');
  let sub = null, row = null;
  try {
    sub = pushApi.permission() === 'granted' ? await pushApi.getSub() : null;
    if (sub) {
      row = await api.getPushRow(sub.toJSON().endpoint);
      if (!row) { await api.savePushRow(subRow(sub)); row = await api.getPushRow(sub.toJSON().endpoint); }   // re-sync a subscription the database lost
    }
  } catch (e) { return draw('<p class="muted small" style="margin:8px 0 0">Couldn’t load alert settings just now.</p>'); }
  const sw = (id, label, on) => '<div class="toggle-line" style="margin:2px 0"><span>' + label + '</span><button class="switch-wrap" id="' + id + '" aria-label="' + label + '"><span class="switch" role="switch" aria-checked="' + on + '"></span></button></div>';
  draw(sw('pushMain', 'Alerts on this device', !!sub) +
    (sub && row ? '<div style="margin:6px 0 0;padding-left:2px">' + sw('pushResch', 'Reschedule accepted', row.notify_reschedule) + sw('pushBook', 'New bookings', row.notify_booking) + sw('pushIntake', 'Intake forms', row.notify_intake) + sw('pushPhoto', 'Photos', row.notify_photo) +
      '<button class="btn ghost block" id="pushTest" type="button" style="margin-top:12px">Send test alert</button></div>' : '') +
    '<p class="muted small" style="margin:10px 0 0">Alerts show only the time — never a name or any detail.</p>');

  document.getElementById('pushMain').onclick = async () => {
    try {
      if (sub) {                                                    // turn off
        const ep = sub.toJSON().endpoint; await pushApi.unsubscribe(sub); await api.deletePushRow(ep);
      } else {                                                      // turn on: permission → subscribe → store
        const perm = await pushApi.requestPermission();
        if (perm !== 'granted') { toastMsg('Alerts weren’t allowed on this device'); return initPushCard(); }
        const ns = await pushApi.subscribe(); await api.savePushRow(subRow(ns));
      }
    } catch (e) { toastMsg(friendly(e, 'change')); }
    initPushCard();
  };
  if (sub && row) {
    const flip = (id, col) => { document.getElementById(id).onclick = async () => { try { await api.updatePushRow(row.endpoint, { [col]: !row[col] }); } catch (e) { toastMsg(friendly(e, 'save')); } initPushCard(); }; };
    flip('pushResch', 'notify_reschedule'); flip('pushBook', 'notify_booking'); flip('pushIntake', 'notify_intake'); flip('pushPhoto', 'notify_photo');
    document.getElementById('pushTest').onclick = async (ev) => {
      const b = ev.currentTarget; b.disabled = true;
      try {
        const r = await api.sendTestPush(row.endpoint);
        toastMsg(r.status === 503 ? 'Alerts aren’t set up on the server yet (VAPID keys)' : r.status === 403 || r.status === 401 ? 'Not allowed' : r.sent > 0 ? 'Test alert sent — check your lock screen' : r.removed > 0 ? 'This device’s subscription had expired — switch alerts off and on again' : 'No alert could be sent');
      } catch (e) { toastMsg(friendly(e, 'send')); }
      b.disabled = false;
    };
  }
}

/* ---------- test data ---------- */
// Rows flagged is_test (a rehearsal client and her bookings) are hidden from Today, Clients, Codes and Stats —
// and so from revenue and counts — unless "Show test data" is on. Delete them with supabase-delete-test-data.sql.
try { S.showTest = localStorage.getItem('haloe_show_test') === '1'; } catch (e) {}
function applyTest() {
  const r = S.raw;
  if (!r) { S.data = null; return; }
  if (S.showTest) { S.data = r; return; }
  const bad = new Set(r.clients.filter((c) => c.is_test).map((c) => c.id));
  const badBk = new Set(r.bookings.filter((b) => b.is_test || (b.client_id && bad.has(b.client_id))).map((b) => b.id));
  S.data = { ...r,
    clients: r.clients.filter((c) => !c.is_test),
    bookings: r.bookings.filter((b) => !badBk.has(b.id)),
    intakes: r.intakes.filter((i) => !bad.has(i.client_id)),
    checkins: r.checkins.filter((x) => !bad.has(x.client_id)),
    photos: (r.photos || []).filter((x) => !bad.has(x.client_id)),
    notes: r.notes.filter((x) => !bad.has(x.client_id)),
    redemptions: r.redemptions.filter((x) => !badBk.has(x.booking_id)) };
}
async function loadAdminData() { S.raw = await api.load(); applyTest(); }
function setShowTest(on) { S.showTest = !!on; try { localStorage.setItem('haloe_show_test', on ? '1' : '0'); } catch (e) {} applyTest(); render(); }
const testPill = (x) => (x && x.is_test ? '<span class="pill gold">Test</span>' : '');

/* ---------- derived ---------- */
function intakeOf(clientId) {
  const rows = S.data.intakes.filter((i) => i.client_id === clientId).sort((a, b) => String(b.created_at).localeCompare(String(a.created_at)));
  return rows[0] || null;
}
function bookingsOfClient(c) {
  return S.data.bookings.filter((b) => b.client_id === c.id || (!b.client_id && lower(b.customer_email) === lower(c.email))).sort(byDateDesc);
}
const lower = (s) => String(s || '').toLowerCase();
const byDateDesc = (a, b) => (b.booking_date + String(b.start_min).padStart(4, '0')).localeCompare(a.booking_date + String(a.start_min).padStart(4, '0'));
// "A real booking": paid/confirmed, including one whose reschedule is waiting for the client's reply
// (it still holds its original slot until she accepts).
const confirmed = (b) => b.status === 'confirmed' || b.status === 'reschedule_pending';
const isPending = (b) => b.status === 'reschedule_pending' && !!b.proposed_starts_at;
// Package names from services-data.js (keep in step). A booking made on one of these IS a package booking.
const PACKAGE_NAMES = ['Pain & Mobility', 'Breathe & Reset', 'Cycle Comfort', 'Stress & Sleep', 'Headache & Tension', 'Digestion & Comfort', 'Circulation & Energy', "Women's Cycle Care"];
const NO_PACKAGE = ['', 'not sure yet', 'single treatment'];
/** Package tag: what checkout stored if it was a package; otherwise the package the client chose on her intake form. */
function pkgOf(b, intakePackage) {
  if (PACKAGE_NAMES.includes(b.treatment)) return b.treatment;
  const p = trimStr(intakePackage);
  return NO_PACKAGE.includes(p.toLowerCase()) ? '' : p;
}
const tagHTML = (p) => (p ? `<span class="tag">${esc(p)}</span>` : '');
/** "Tue 13 Oct, 6:30pm" from a timestamptz, in London time. */
function fmtTs(ts) {
  if (!ts) return '';
  const d = new Date(ts);
  const day = d.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', timeZone: 'Europe/London' });
  const time = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/London', hour: 'numeric', minute: '2-digit', hour12: true }).format(d).replace(' ', '').toLowerCase();
  return `${day}, ${time}`;
}
/** Admin status chip: amber while she hasn't replied, green once she has accepted. */
function statusChip(b) {
  if (isPending(b)) return '<span class="pill amber">Awaiting reply</span>';
  if (b.confirmed_at && b.status === 'confirmed') return '<span class="pill green">Confirmed</span>';
  return '';
}
const HALIMA_WA = '447474833643';
/** WhatsApp link for a proposed reschedule. No clinical or period details, ever. */
function rescheduleWA(b, phone, fullName) {
  const msg = `Hi ${firstName(fullName)}, it's Halima from haloe. I've moved your session to ${fmtTs(b.proposed_starts_at)}. Please sign in with the email you booked with to see and accept it: https://haloe.health/app`;
  return 'https://wa.me/' + waNumber(phone) + '?text=' + encodeURIComponent(msg);
}
const hasIntake = (b) => !!(b.client_id && intakeOf(b.client_id));

/** The people list = every client + anyone who has booked but has no client record yet. */
function people() {
  const out = []; const seen = new Set();
  for (const c of S.data.clients) {
    seen.add(lower(c.email));
    out.push({ key: 'c/' + c.id, name: c.full_name, phone: c.phone, email: c.email, client: c, bookings: bookingsOfClient(c) });
  }
  for (const b of S.data.bookings.filter(confirmed)) {
    const em = lower(b.customer_email);
    if (b.client_id || seen.has(em)) continue;
    seen.add(em);
    const bs = S.data.bookings.filter((x) => !x.client_id && lower(x.customer_email) === em).sort(byDateDesc);
    out.push({ key: 'b/' + b.id, name: b.customer_name, phone: b.customer_phone, email: b.customer_email, client: null, bookings: bs });
  }
  return out;
}
function nextBookingDate(p) {
  const t = todayISO();
  const up = p.bookings.filter((b) => confirmed(b) && b.booking_date >= t).map((b) => b.booking_date).sort();
  return up[0] || null;
}

/** Build the practitioner brief + the ACT ON THIS flags from the stored answers. */
function buildFlags(client, intake) {
  const flags = [];
  if (!intake) { flags.push({ t: 'No intake form yet', d: 'Nothing on file for screening, medications, allergies, consent or signature. Ask in person before you start.' }); return flags; }
  const yes = SAFETY.filter(([k]) => { const v = trimStr(intake[k]); return v && lower(v) !== 'no'; });
  for (const [k, label] of yes) {
    const v = trimStr(intake[k]);
    flags.push({ t: label, d: lower(v) === 'yes' ? 'Answered Yes' : 'Answered: ' + v });
  }
  if (yes.length && trimStr(intake.safety_notes)) flags.push({ t: 'Their safety note', d: '“' + trimStr(intake.safety_notes) + '”' });
  const meds = trimStr(intake.current_medications);
  if (meds && CLOT_RE.test(meds)) {
    const hit = meds.match(CLOT_RE)[0];
    flags.push({ t: 'Medication on the clotting watch-list: ' + hit.toLowerCase(), d: 'As typed: “' + meds.replace(/\s+/g, ' ') + '”' });
  }
  if (lower(intake.is_pregnant) === 'yes' || lower(intake.breastfeeding) === 'yes') { /* already listed above */ }
  if (!trimStr(intake.main_concern)) flags.push({ t: 'No main concern given', d: 'The main-concern box was left blank. Ask what they want from the session.' });
  const own = norm10(client && client.phone), emer = norm10(intake.emergency_contact_phone);
  if (own && emer && own === emer) flags.push({ t: 'Emergency contact is their own number', d: 'Ask for someone else.' });
  if (!own && !emer) { /* nothing */ }
  return flags;
}

/** The one-time-link request. Resolves true if the link was sent, false for ANY failure (network down, rate limit, anything) —
 *  the caller shows a calm message; technical error text is never shown to anyone. */
const SEND_FAILED_MSG = "That didn't send. Please try again in a minute.";
async function sendLink(email) {
  if (navigator.onLine === false) return 'offline';                  // don't even try
  // Sign-ups stay ON: anyone can sign in with an email link. What a signed-in user can SEE is decided
  // entirely by row-level security (admin → everything; client → only their own rows).
  const attempt = sb.auth.signInWithOtp({ email, options: { shouldCreateUser: true, emailRedirectTo: location.origin + '/app/' } })
    .then(({ error }) => (error ? 'failed' : 'sent'), () => (navigator.onLine === false ? 'offline' : 'failed'));
  const giveUp = new Promise((res) => setTimeout(() => res('failed'), TIMEOUT_MS + 500));   // belt and braces: a late answer is ignored
  return Promise.race([attempt, giveUp]);
}
const sendMsg = (r) => (r === 'offline' ? OFFLINE_MSG : SEND_FAILED_MSG);

/* ---- the three glance lines on a session card (admin only; her intake words, verbatim, no interpretation) ----
 * Real intake fields:  package  ("Which package or treatment are you booking?")

const normPkg = (t) => String(t || '').split(' — ')[0].trim().toLowerCase();
/** Does what she chose on the intake differ from what was booked? Only a real mismatch is flagged. */
function packageDiffers(chosen, bookedTreatment) {
  const c = normPkg(chosen), bk = String(bookedTreatment || '').trim().toLowerCase();
  if (!c || c === 'not sure yet') return false;
  if (c === 'single treatment') return PACKAGE_NAMES.some((p) => p.toLowerCase() === bk);   // she said single treatment but a package was booked
  return c !== bk;
}
const firstLineOf = (t) => String(t).split(/\r?\n/)[0];
function glanceHTML(b, feature) {
  const intake = b.client_id ? intakeOf(b.client_id) : null;

  if (chosen) pkg = '<b class="pkg">' + esc(chosen) + '</b>' + (packageDiffers(chosen, b.treatment) ? '<span class="flag">Chose: ' + esc(chosen) + ' · Booked: ' + esc(b.treatment || '—') + '</span>' : '');
  else pkg = '<b class="pkg">' + esc(b.treatment || '—') + '</b><span class="dim">booked' + (intake ? ' · no package chosen' : '') + '</span>';

function nextClinicDate() { let d = todayISO(); while (dow(d) !== CLINIC_WEEKDAY) d = addDays(d, 1); return d; }

/* ---- Progress (check-ins) ---- */
// Scores and the client's own words only — labels are Concern / Energy / Sleep / Pain areas.
const shortDate = (ms) => new Date(ms).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', timeZone: 'Europe/London' });
function checkinsOf(c) { return c ? S.data.checkins.filter((x) => x.client_id === c.id).sort((a, b) => new Date(a.taken_at) - new Date(b.taken_at)) : []; }
function pts(list, key) { return list.filter((x) => x[key] != null).map((x) => ({ t: new Date(x.taken_at).getTime(), v: x[key] })); }
/** Thin gold line, soft fill, 0–10 axis. `lines` = [{pts, cls, dot, fill}]. */
function chartSVG(lines) {
  const W = 320, H = 168, L = 24, R = 10, T = 10, B = 24;
  const all = lines.flatMap((l) => l.pts); if (!all.length) return '';
  const t0 = Math.min(...all.map((p) => p.t)), t1 = Math.max(...all.map((p) => p.t));
  const x = (t) => (t1 === t0 ? (L + W - R) / 2 : L + ((t - t0) / (t1 - t0)) * (W - L - R));
  const y = (v) => T + ((10 - v) / 10) * (H - T - B);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Progress chart"><defs><linearGradient id="pg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--gold)" stop-opacity=".30"/><stop offset="1" stop-color="var(--gold)" stop-opacity="0"/></linearGradient></defs>`;
  for (const g of [0, 5, 10]) s += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(g)}" y2="${y(g)}"/><text class="ax" x="${L - 6}" y="${y(g) + 3.5}" text-anchor="end">${g}</text>`;
  for (const l of lines) {
    if (!l.pts.length) continue;
    const d = l.pts.map((p, i) => (i ? 'L' : 'M') + x(p.t).toFixed(1) + ' ' + y(p.v).toFixed(1)).join(' ');
    if (l.fill && l.pts.length > 1) s += `<path d="${d} L${x(l.pts[l.pts.length - 1].t).toFixed(1)} ${H - B} L${x(l.pts[0].t).toFixed(1)} ${H - B} Z" fill="url(#pg)"/>`;
    s += `<path class="${l.cls}" d="${d}"/>` + l.pts.map((p) => `<circle class="${l.dot}" cx="${x(p.t).toFixed(1)}" cy="${y(p.v).toFixed(1)}" r="3.5"/>`).join('');
  }
  s += `<text class="ax" x="${L}" y="${H - 6}">${shortDate(t0)}</text><text class="ax" x="${W - R}" y="${H - 6}" text-anchor="end">${t1 === t0 ? '' : shortDate(t1)}</text></svg>`;
  return s;
}
function progressBody(list, mode) {
  const yearAgo = Date.now() - 365 * 864e5;
  const L12 = list.filter((x) => new Date(x.taken_at).getTime() >= yearAgo);
  const delta = (label, p) => (p.length >= 2 ? `${label} ${p[0].v} → ${p[p.length - 1].v}` : null);
  if (mode === 'concern') {
    const c = pts(L12, 'concern_score');
    if (c.length < 2) return '<p class="muted small">Not enough readings yet.</p>';
    return `${chartSVG([{ pts: c, cls: 'ln', dot: 'dot', fill: true }])}<div class="delta">${delta('Concern', c)} since ${shortDate(c[0].t)}</div>`;
  }
  const e = pts(L12, 'energy'), sl = pts(L12, 'sleep');
  if (e.length < 2 && sl.length < 2) return '<p class="muted small">Not enough readings yet.</p>';
  const first = Math.min(...[e[0], sl[0]].filter(Boolean).map((p) => p.t));
  const ds = [delta('Energy', e), delta('Sleep', sl)].filter(Boolean).join(' · ');
  return `${chartSVG([{ pts: e, cls: 'ln', dot: 'dot', fill: true }, { pts: sl, cls: 'ln2', dot: 'dot2' }])}
    <div class="legend"><span><i></i>Energy</span><span><i class="d"></i>Sleep</span></div><div class="delta">${ds} since ${shortDate(first)}</div>`;
}

/* ---- Milton Hall lock-up rule (admin side) ----
 * start + the treatment's REAL duration + tidy-up must be <= closing time (CLINIC_RULES in /clinic-rules.js — the one place to change it).
 * Durations come from the catalogue (/services-data.js), never guessed. Home visits are exempt. */
function svcMinutes(svc) {
  if (Number(svc.sessionMin) > 0) return Number(svc.sessionMin);
  const hr = /(\d+)\s*(?:hours?|hrs?|hr)\b/i.exec(svc.time || ''), mn = /(\d+)\s*min/i.exec(svc.time || '');
  const total = (hr ? parseInt(hr[1], 10) * 60 : 0) + (mn ? parseInt(mn[1], 10) : 0);
  return total > 0 ? total : null;                                    // null = no duration stored
}
/** The booking's real treatment length in minutes, or null if it can't be determined from the data. */
function bookingDurationMin(b) {
  if (Array.isArray(b.treatments) && b.treatments.length) {            // multi-treatment booking: the stored list carries each real length
    const sum = b.treatments.reduce((n, t) => n + (Number(t.min) || 0), 0);
    if (sum > 0) return sum;
  }
  const blocked = (b.end_min || 0) - (b.start_min || 0);
  const cands = [];
  for (const list of Object.values(SERVICES)) for (const svc of list) if (lower(svc.name) === lower(b.treatment)) { const m = svcMinutes(svc); if (m) cands.push(m); }
  if (!cands.length) return null;
  // the same name exists as dry AND wet cupping at different lengths: pick the one the stored blocked interval agrees with
  return cands.find((d) => blocked === d || blocked === d + 15) || Math.max(...cands);
}
const closingLabel = (min) => { const h = Math.floor(min / 60), m = min % 60; return ((h + 11) % 12 + 1) + (m ? ':' + String(m).padStart(2, '0') : '') + (h < 12 ? 'am' : 'pm'); };
/** null if the time is fine (or not Milton Hall); otherwise the calm explanation. */
function clinicOverrunMessage(b, startMin) {
  if (!b || b.location !== 'clinic' || !window.CLINIC_RULES) return null;
  const dur = bookingDurationMin(b); if (!dur) return null;
  const R = CLINIC_RULES;
  if (R.fits(startMin, dur)) return null;
  return 'This would finish at ' + fmtTime(R.finishMin(startMin, dur)) + '. The clinic closes at ' + closingLabel(R.closingMin) + '. Latest start for this treatment is ' + fmtTime(R.latestStart(dur)) + '.';
}

/* ---- Reschedule (admin) ---- */
function tsParts(ts) {
  const f = new Intl.DateTimeFormat('en-CA', { timeZone: 'Europe/London', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).formatToParts(new Date(ts));
  const g = (t) => f.find((x) => x.type === t).value;
  return { date: g('year') + '-' + g('month') + '-' + g('day'), min: Number(g('hour')) * 60 + Number(g('minute')) };
}
function openReschedule(bookingId, p) {
  const b0 = S.data.bookings.find((x) => x.id === bookingId); if (!b0) return;
  const pend = isPending(b0), cur = pend ? tsParts(b0.proposed_starts_at) : { date: nextClinicDate(), min: b0.start_min };
  const times = []; for (let m = 7 * 60; m <= 21 * 60 + 45; m += 15) times.push(m);
  const phone = p.phone || b0.customer_phone;
  const bg = document.createElement('div'); bg.className = 'sheet-bg';
  const body = () => {
    const b = S.data.bookings.find((x) => x.id === bookingId);
    const waBtn = isPending(b) && phone ? `<a class="btn block" id="rs-wa" target="_blank" rel="noopener" href="${esc(rescheduleWA(b, phone, p.name))}">Send on WhatsApp</a>` : '';
    return `<div class="grab"></div><div class="lab">Reschedule</div>
      <div style="font-weight:700;font-size:20px;letter-spacing:-.02em;margin-top:2px">${esc(p.name)}</div>
      <p class="muted small" style="margin:6px 0 0">Now: ${esc(fmtDate(b.booking_date))} · ${fmtTime(b.start_min)} · ${esc(treatmentLabel(b))}. The current time stays held until she accepts. Payment isn't touched.</p>
      ${isPending(b) ? `<div class="warn" style="background:var(--fill);border-color:transparent"><b style="color:var(--ink)">Awaiting reply</b> — proposed: ${esc(fmtTs(b.proposed_starts_at))}</div>` : ''}
      <label class="f" for="rs-date">Date</label><input class="in" id="rs-date" type="date" value="${cur.date}" min="${todayISO()}">
      <label class="f" for="rs-time">Time</label>
      <select class="in" id="rs-time">${times.map((m) => `<option value="${m}" ${m === cur.min ? 'selected' : ''}>${fmtTime(m)}</option>`).join('')}</select>
      <div id="rs-warn" aria-live="polite"></div>
      <div class="sheet-actions" style="grid-template-columns:1fr">${waBtn}
        <button class="btn ${waBtn ? 'ghost' : ''}" id="rs-save" type="button">${isPending(b) ? 'Update proposed time' : 'Save new time'}</button>
        ${isPending(b) ? '<button class="btn ghost" id="rs-cancel-resched" type="button">Cancel the reschedule</button>' : ''}
        <button class="btn ghost" id="rs-close" type="button">Close</button></div>`;
  };
  const draw = () => {
    bg.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="Reschedule">${body()}</div>`;
    bg.querySelector('#rs-close').onclick = () => bg.remove();
    bg.querySelector('#rs-save').onclick = async () => {
      const dateISO = bg.querySelector('#rs-date').value, min = Number(bg.querySelector('#rs-time').value);
      if (!dateISO) { toastMsg('Choose a date'); return; }
      const btn = bg.querySelector('#rs-save');
      // Milton Hall lock-up: block a time that would overrun closing, with a clear confirm to override (Halima knows her own day).
      const bk = S.data.bookings.find((x) => x.id === bookingId);
      const over = clinicOverrunMessage(bk, min), keyNow = dateISO + '|' + min;
      if (over && bg.dataset.override !== keyNow) {
        bg.dataset.override = keyNow;
        bg.querySelector('#rs-warn').innerHTML = '<div class="warn"><b>Past closing time.</b> ' + esc(over) + '<br><span class="muted small">That includes ' + CLINIC_RULES.TIDY_UP_MIN + ' minutes to tidy up. Choose another time, or save it anyway if you know your day.</span></div>';
        btn.textContent = 'Save anyway — I know this runs past closing';
        return;
      }
      btn.disabled = true;
      try { await api.proposeReschedule(bookingId, dateISO, min); await loadAdminData(); render(); cur.date = dateISO; cur.min = min; draw(); toastMsg('Saved — now send it on WhatsApp'); }
      catch (e) { toastMsg(/clash/.test(String(e && e.message)) ? 'That time overlaps another booking' : friendly(e, 'save')); btn.disabled = false; }
    };
    const resetOverride = () => { delete bg.dataset.override; bg.querySelector('#rs-warn').innerHTML = ''; const sb2 = bg.querySelector('#rs-save'); sb2.textContent = isPending(S.data.bookings.find((x) => x.id === bookingId)) ? 'Update proposed time' : 'Save new time'; };
    bg.querySelector('#rs-date').onchange = resetOverride; bg.querySelector('#rs-time').onchange = resetOverride;
    const cancel = bg.querySelector('#rs-cancel-resched');
    if (cancel) cancel.onclick = async () => {
      try { await api.cancelReschedule(bookingId); await loadAdminData(); render(); bg.remove(); toastMsg('Reschedule cancelled'); } catch (e) { toastMsg(friendly(e, 'cancel')); }
    };
  };
  bg.onclick = (e) => { if (e.target === bg) bg.remove(); };
  document.body.appendChild(bg); draw();
}

/** Shrink a photo in the browser: longest side ≤ 1600px, JPEG ≤ ~1.5 MB. Re-encoding also drops EXIF (location etc.). */
async function compressImage(file, maxBytes = 1.5 * 1024 * 1024, maxSide = 1600) {
  // Some browsers report an empty type for iPhone HEIC/HEIF files, so the extension counts too.
  if (!/^image\//.test(file.type || '') && !/\.(jpe?g|png|webp|heic|heif)$/i.test(file.name || '')) throw new Error('not_image');
  let bmp;
  try { bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch (e) { bmp = await new Promise((res, rej) => { const u = URL.createObjectURL(file), im = new Image(); im.onload = () => { URL.revokeObjectURL(u); res(im); }; im.onerror = () => { URL.revokeObjectURL(u); rej(new Error(/hei[cf]/i.test((file.type || '') + (file.name || '')) ? 'heic_unsupported' : 'unreadable')); }; im.src = u; }); }
  const w0 = bmp.width || bmp.naturalWidth, h0 = bmp.height || bmp.naturalHeight;
  let scale = Math.min(1, maxSide / Math.max(w0, h0)), q = 0.86, blob = null;
  for (let i = 0; i < 12; i++) {
    const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(w0 * scale)); c.height = Math.max(1, Math.round(h0 * scale));
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(bmp, 0, 0, c.width, c.height);
    blob = await new Promise((res) => c.toBlob(res, 'image/jpeg', q));
    if (blob && blob.size <= maxBytes) break;
    if (q > 0.56) q -= 0.1; else scale *= 0.8;
  }
  if (bmp.close) bmp.close();
  if (!blob || blob.size > maxBytes) throw new Error('too_large');
  return blob;
}

      if (picked.length >= 3) { toastMsg('Up to 3 photos'); break; }
      try { const blob = await compressImage(f); picked.push({ blob, url: URL.createObjectURL(blob) }); }
      catch (e) { toastMsg(e.message === 'not_image' ? 'That file isn’t a photo' : e.message === 'heic_unsupported' ? 'This phone can’t open that photo type here. Please choose a JPEG or PNG, or take a new photo.' : 'That photo couldn’t be used'); }
    }
    draw();
  };
  $('phCam').onchange = (e) => { add(e.target.files); e.target.value = ''; };
  $('phPick').onchange = (e) => { add(e.target.files); e.target.value = ''; };
  $('phCancel').onclick = close;
  bg.onclick = (e) => { if (e.target === bg) close(); };
  $('phSend').onclick = async () => {
    const btn = $('phSend'); if (navigator.onLine === false) { toastMsg(OFFLINE_MSG); return; }     // keep the photos and note; nothing is lost
    btn.disabled = true; btn.textContent = 'Sending…';
    const done = [];
    try {
      const stamp = Date.now();
      for (let i = 0; i < picked.length; i++) {
        const path = client.id + '/' + stamp + '-' + i + '-' + Math.random().toString(36).slice(2, 8) + '.jpg';
        await api.uploadPhoto(path, picked[i].blob); done.push(path);
      }
      const row = await api.addPhotoSubmission({ client_id: client.id, booking_id: latest ? latest.id : null, note: $('phNote').value.trim() || null, paths: done });
      api.alertPhoto(row.id).catch(() => {});                  // Halima is told by push + email; a failure here never undoes the upload
      close(); toastMsg('Sent. Halima will take a look.');
    } catch (e) {
      try { await api.removePhotos(done); } catch (x) {}       // don't leave orphaned files behind
      toastMsg(friendly(e, 'send')); btn.disabled = false; btn.textContent = 'Send to Halima';
    }
  };
}

/* A failed first load: one calm line and a way to try again (the session is kept). */
function loadErrorHTML() { return '<p style="margin:0 0 14px">' + esc(S.error) + '</p><button class="btn ghost" id="retryLoad" type="button">Try again</button>'; }
document.addEventListener('click', (ev) => { if (ev.target && ev.target.id === 'retryLoad' && S.session) { S.error = null; const sess = S.session; S.session = null; enter(sess); } });

/* ---------- router / boot ---------- */
const ADMIN_VIEWS = ['today', 'clients', 'codes', 'stats', 'settings'], CLIENT_VIEWS = ['home', 'progress', 'book', 'aftercare', 'settings'];
function route() {
  const h = (location.hash || (S.isClient ? '#/home' : '#/today')).replace(/^#\//, '');
  const [path, qs] = h.split('?');
  const parts = path.split('/');
  if (!S.isClient && parts[0] === 'brief') { S.view = 'brief'; S.briefKey = parts[1] + '/' + parts[2]; S.briefBid = new URLSearchParams(qs || '').get('b'); }
  else if (S.isClient) S.view = CLIENT_VIEWS.includes(parts[0]) ? parts[0] : 'home';
  else S.view = ADMIN_VIEWS.includes(parts[0]) ? parts[0] : 'today';
  if (S.view !== 'brief') S.briefRetried = null;
}
function render() {
  if (!S.session) return viewLogin();
  clearInterval(S.loginTimer);
  if (S.admin) {
    if (!S.data) { shell('<div class="empty">' + (S.error ? loadErrorHTML() : 'Loading…') + '</div>', false); return; }
    route();
    window.scrollTo(0, 0);
    ({ today: viewToday, clients: viewClients, codes: viewCodes, stats: viewStats, settings: viewSettings, brief: () => viewBrief(S.briefKey, S.briefBid) })[S.view]();
    return;
  }
  // client
  if (!S.cdata) { shell('<div class="empty">' + (S.error ? loadErrorHTML() : 'Loading…') + '</div>', false); return; }
  if (!S.cdata.client && !S.cdata.bookings.length) return viewNoMatch();      // nothing of theirs on file yet
  route();
  window.scrollTo(0, 0);
  ({ home: viewHome, progress: viewProgress, book: viewBook, aftercare: viewAftercare, settings: viewSettings })[S.view]();
}
async function refreshData() { await loadAdminData(); render(); }
async function enter(session) {
  if (!session) return clearSession();
  S.session = session;
  S.admin = false; S.isClient = false; S.data = null; S.raw = null; S.cdata = null; S.error = null;
  const { data: prof } = await sb.from('profiles').select('role,client_id').eq('id', session.user.id).maybeSingle();
  if (prof && prof.role === 'admin') {
    // Admin app: nothing is loaded unless profiles.role = 'admin' (and RLS would refuse anyway).
    S.admin = true; render();
    try { await loadAdminData(); } catch (e) { S.error = friendly(e, 'load').replace("That didn't load.", "That didn't load just now."); }
    return render();
  }
  // Client: link to their clients row by email (case-insensitive) or phone — re-tried on every sign-in,
  // since the intake form may have been submitted after their first visit here.
  S.isClient = true; render();
  if (!(prof && prof.client_id)) await api.linkMyClient();
  try { S.cdata = await api.loadClient(); } catch (e) { S.error = friendly(e, 'load').replace("That didn't load.", "That didn't load just now."); }
  render();
}
window.addEventListener('hashchange', () => { if ((S.admin && S.data) || (S.isClient && S.cdata)) render(); });
sb.auth.onAuthStateChange((ev, session) => {
  if (ev === 'SIGNED_OUT') enter(null);
  else if (ev === 'SIGNED_IN' || ev === 'INITIAL_SESSION') { if (!S.session || S.session.user.id !== (session && session.user.id)) setTimeout(() => enter(session), 0); }
});
// A tapped alert asks the open app to move to that booking (the service worker posts this message).
if ('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message', (e) => {
  if (e.data && e.data.type === 'open' && typeof e.data.url === 'string' && S.admin) { const h = new URL(e.data.url, location.origin).hash; if (h) location.hash = h; }
});
window.haloe = { api, S, render, pushApi, sb };       // exposed for local testing; holds no data until an admin signs in
if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('/app/sw.js', { scope: '/app/' }).catch(() => {}));
</script>
